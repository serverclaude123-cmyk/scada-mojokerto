; Firmware gateway VSD ABB (ACS310/ACS550) -> MQTT
; Board: KhursLabs ESP32-S3 IoT Acquisition RS485 Modbus-Ethernet (ESP32-S3 WROOM-1 + W5500)
; Memakai arduino-esp32 3.x (ETH.begin untuk W5500 SPI) lewat platform pioarduino.
[env:khurslabs-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1    ; Serial lewat USB-C (native USB S3)
    -DARDUINO_USB_MODE=1
lib_deps =
    knolleary/PubSubClient@^2.8
