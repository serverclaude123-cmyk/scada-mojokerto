# Mosquitto untuk SCADA Mojokerto.
#
# SALIN file ini ke folder instalasi Mosquitto, karena service membacanya DARI SANA:
#   C:\Users\AIOPC\Tools\mosquitto\mosquitto.conf
# Path di bawah absolut dan khusus PC ini -- sesuaikan kalau dipasang di komputer lain.
#
# Service jalan sebagai LocalSystem dengan CWD yang tidak pasti,
# jadi SEMUA path di sini harus absolut.

# Dengar di semua antarmuka, bukan cuma localhost.
# Tanpa ini ESP32 (192.168.1.11) tidak akan pernah bisa connect.
listener 1883 0.0.0.0

allow_anonymous false
password_file C:\Users\AIOPC\Documents\scada-mojokerto\broker\passwd

persistence true
persistence_location C:\Users\AIOPC\Tools\mosquitto\

log_dest file C:\Users\AIOPC\Tools\mosquitto\mosquitto.log
log_type error
log_type warning
log_type notice
