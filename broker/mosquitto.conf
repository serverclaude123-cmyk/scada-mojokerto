# Mosquitto untuk SCADA Mojokerto -- dibaca oleh Windows service "mosquitto".
#
# Catatan penting:
# - Service jalan sebagai LocalSystem dengan CWD tidak pasti -> semua path absolut.
# - Pakai FORWARD SLASH. Backslash di akhir baris dibaca sebagai penyambung baris
#   dan diam-diam merusak parsing config.
# - TIDAK memakai "log_dest file". File log yang pernah dibuat LocalSystem akan
#   ber-ACL yang menolak akun biasa, sehingga Mosquitto gagal start kalau nanti
#   dijalankan manual. Biarkan default (Event Log saat jadi service).

listener 1883 0.0.0.0

allow_anonymous false
password_file C:/Users/AIOPC/Documents/scada-mojokerto/broker/passwd

persistence true
persistence_location C:/Users/AIOPC/Tools/mosquitto/

log_type error
log_type warning
log_type notice
